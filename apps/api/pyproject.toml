[project]
name = "ticket-api"
version = "1.0.0"
description = "Ticket booking API — seat holds, waitlist offers, QR tickets"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  # [asyncio] pulls greenlet, which SQLAlchemy 2.0 made an optional extra.
  # Without it create_async_engine fails at import with a bare ModuleNotFoundError.
  "sqlalchemy[asyncio]>=2.0.36",
  # psycopg3, NOT asyncpg. See RULE 16 in docs/CONVENTIONS.md — asyncpg leaks prepared
  # statements through Supabase's transaction pooler under burst load.
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyjwt>=2.10",
  "argon2-cffi>=23.1",
  "python-socketio>=5.12",
  "redis>=5.2",
  "arq>=0.26",
  "qrcode[pil]>=8.0",
  "resend>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Email HTML uses inline styles on single lines because email clients are not
# browsers — external stylesheets and wrapped attributes are both unreliable in
# Outlook. Wrapping these to satisfy a line-length rule would make the markup
# worse, not better.
"src/ticket_api/lib/emails.py" = ["E501"]
