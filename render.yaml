# Render Blueprint for the API.
#
# The database lives on Supabase and the frontend on Vercel, so this file
# describes one web service. Deliberately not a Render Postgres: the free tier
# there expires after 30 days, which would kill a hosted submission mid-review.
#
# Import via Render → New → Blueprint, pointing at this repository.

services:
  - type: web
    name: ticket-booking-api
    runtime: python
    plan: free
    region: singapore # match your Supabase region — cross-region adds ~200ms per query
    rootDir: apps/api
    # Install the package, then apply any pending migrations. Alembic runs
    # against DIRECT_URL (session pooler, :5432) rather than the transaction
    # pooler, because pgbouncer cannot hold the advisory lock a migration takes.
    # That is why both connection strings are required.
    buildCommand: pip install --upgrade pip && pip install -e . && alembic upgrade head
    # One worker, deliberately. The free plan has 512MB, Socket.IO connections
    # are stateful, and a second worker without the Redis manager wired would
    # silently drop half of every broadcast (rule 15).
    startCommand: uvicorn ticket_api.main:asgi --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_ENV
        # Kept as NODE_ENV rather than renamed: it is the deployment contract
        # every existing environment already sets, and config.py reads it.
        value: production
      # Render injects PORT; the start command passes it to uvicorn.
      - key: WEB_URL
        sync: false # set to the Vercel URL — this is the CORS allowlist
      - key: DATABASE_URL
        sync: false # Supabase TRANSACTION pooler, :6543
      - key: DIRECT_URL
        sync: false # Supabase SESSION pooler, :5432 — migrations only
      - key: REDIS_URL
        sync: false # Upstash rediss:// — the email queue and socket manager
      - key: JWT_SECRET
        sync: false # openssl rand -base64 48
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Ticket Booking <onboarding@resend.dev>
      # MAIL_REDIRECT_TO is deliberately absent: it is ignored in production,
      # because silently redirecting a customer's ticket is worse than not
      # sending it.
      - key: HOLD_TTL_SECONDS
        value: 600
      - key: OFFER_TTL_SECONDS
        value: 600
      - key: SWEEPER_INTERVAL_MS
        value: 10000
      - key: MAX_SEATS_PER_HOLD
        value: 6
      - key: MAX_ACTIVE_HOLDS_PER_USER
        value: 2

  # The email worker. Separate from the web service because a request handler
  # must never wait on a mail provider, and because a worker that crashes
  # should not take the API down with it.
  #
  # Commented out rather than deleted: Render's free plan allows one service.
  # Uncomment on a paid plan, or run it anywhere that can reach the same Redis.
  #
  # - type: worker
  #   name: ticket-booking-email-worker
  #   runtime: python
  #   plan: starter
  #   rootDir: apps/api
  #   buildCommand: pip install --upgrade pip && pip install -e .
  #   startCommand: arq ticket_api.jobs.email_queue.WorkerSettings
  #   envVars:
  #     - fromGroup: ticket-booking-api
